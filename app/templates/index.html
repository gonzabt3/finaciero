{% extends 'base.html' %}
{% block content %}
<section>
  <h2>Ingesta de texto manual</h2>
  <form method="post" action="/ingest/text">
    <label>Título
      <input type="text" name="title" required />
    </label>
    <label>Autor
      <input type="text" name="author" />
    </label>
    <label>Source name
      <input type="text" name="source_name" />
    </label>
    <label>Texto
      <textarea name="text" rows="8" required></textarea>
    </label>
    <button type="submit">Procesar texto</button>
  </form>
</section>

<section>
  <h2>Ingesta de artículo por URL</h2>
  <form method="post" action="/ingest/url">
    <label>URL
      <input type="url" name="url" required />
    </label>
    <label>Título opcional
      <input type="text" name="title" />
    </label>
    <button type="submit">Procesar URL</button>
  </form>
</section>
{% endblock %}
